services:
  kometa:
    image: ${image}
    container_name: ${container_name}
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    - KOMETA_TIME=03:00
    - KOMETA_RUN=true
    - KOMETA_TEST=False
    - KOMETA_NO_MISSING=False
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.kometa == true
      restart_policy:
        condition: any
    volumes:
    - ${config_vol}
    - /var/lib/docker/volumes/kometa-w-swarm/config:/config
volumes: {}
